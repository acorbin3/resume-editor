# Local or single-server deployment.
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:4747
#
# Claude backend, pick one in .env:
#   ANTHROPIC_API_KEY=...                 direct API (use this for anything public)
#   CLAUDE_BRIDGE_TOKEN=... + `npm run bridge` on the host: the container uses the
#                                         Claude Code login on this machine (your own use only)
services:
  app:
    build: .
    image: resume-editor
    restart: unless-stopped
    ports:
      - "${PORT:-4747}:3000"
    env_file:
      - .env
    environment:
      # Inside the container the app always listens on 3000; PORT above is the host side.
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      # Reaches scripts/claude-bridge.js on the host when CLAUDE_BRIDGE_TOKEN is set and no API key is.
      # Docker Desktop and Rancher Desktop provide host.docker.internal. On plain Linux Docker,
      # add `extra_hosts: ["host.docker.internal:host-gateway"]` here (or just use an API key).
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:4848}
    volumes:
      - resume-data:/data
    # LaTeX compiles run inside this container; keep it unprivileged and resource-capped.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  resume-data:
